<!DOCTYPE html>
<!--
  ASSET-FORGE · Premium Pack — Google Sheets "Pro" edition
  Sidebar.html — the "💬 ask your data" chat UI for the Gemini tier.
  Calls the server-side afAskGemini() via google.script.run. Grounded,
  read-only: it explains the owner's numbers, it never acts on them.
-->
<html>
  <head>
    <base target="_top">
    <style>
      :root { --ink:#1A2B45; --muted:#6B7280; --line:#E5E8EE; --accent:#15A38C; }
      * { box-sizing: border-box; }
      body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
             color: var(--ink); margin: 0; padding: 10px; font-size: 13px; }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .hint { color: var(--muted); font-size: 11px; margin: 0 0 10px; }
      #log { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
      .msg { padding: 8px 10px; border-radius: 10px; white-space: pre-wrap;
             line-height: 1.35; }
      .me { background: #EEF2F7; align-self: flex-end; max-width: 92%; }
      .ai { background: #F2FBF8; border: 1px solid #D6F0E8; max-width: 96%; }
      .sys { color: var(--muted); font-size: 11px; font-style: italic; }
      .row { display: flex; gap: 6px; }
      textarea { flex: 1; resize: vertical; min-height: 46px; padding: 7px;
                 border: 1px solid var(--line); border-radius: 8px; font: inherit; }
      button { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
               padding: 0 14px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 10px; }
      .chip { background: #fff; border: 1px solid var(--line); border-radius: 14px;
              padding: 3px 9px; font-size: 11px; cursor: pointer; color: var(--ink); }
    </style>
  </head>
  <body>
    <h1>💬 Spýtaj sa svojich dát</h1>
    <p class="hint">Odpovede vychádzajú len z čísel vo vašom hárku „Prehľad".
       Nič neobjednáva ani neplatí — len vysvetľuje.</p>

    <div class="chips" id="chips">
      <span class="chip">Ako sa nám darí tento mesiac?</span>
      <span class="chip">Kde strácam najviac peňazí?</span>
      <span class="chip">Čo mám dnes riešiť ako prvé?</span>
    </div>

    <div id="log"></div>

    <div class="row">
      <textarea id="q" placeholder="Napíšte otázku…"></textarea>
      <button id="send" onclick="ask()">Odoslať</button>
    </div>

    <script>
      var log = document.getElementById('log');
      var box = document.getElementById('q');
      var btn = document.getElementById('send');

      document.getElementById('chips').addEventListener('click', function (e) {
        if (e.target.classList.contains('chip')) { box.value = e.target.textContent; ask(); }
      });
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) ask();
      });

      function add(cls, text) {
        var d = document.createElement('div');
        d.className = 'msg ' + cls; d.textContent = text;
        log.appendChild(d); d.scrollIntoView();
      }

      function ask() {
        var q = box.value.trim();
        if (!q) return;
        add('me', q); box.value = '';
        btn.disabled = true;
        var thinking = document.createElement('div');
        thinking.className = 'msg sys'; thinking.textContent = 'premýšľam…';
        log.appendChild(thinking);
        google.script.run
          .withSuccessHandler(function (ans) {
            thinking.remove(); add('ai', ans); btn.disabled = false; box.focus();
          })
          .withFailureHandler(function (err) {
            thinking.remove(); add('sys', '⚠️ ' + err.message); btn.disabled = false;
          })
          .afAskGemini(q);
      }
    </script>
  </body>
</html>
